<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-2-stroke { fill: none; stroke: #4DD0E1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .logo-2-node { fill: #4DD0E1; }
      .logo-2:hover .logo-2-node { filter: drop-shadow(0 0 5px rgba(77,208,225,0.9)); }
      .logo-2:hover .logo-2-stroke { stroke-width: 2.2; filter: drop-shadow(0 0 8px rgba(77,208,225,0.5)); }
    </style>
  </defs>
  <g class="logo-2">
    <!-- P as circuit path -->
    <path class="logo-2-stroke" d="M 16 48 L 16 16 L 28 16 Q 34 16 34 22 Q 34 28 28 28 L 16 28"/>
    <!-- Connection line -->
    <path class="logo-2-stroke" d="M 34 28 L 42 28"/>
    <!-- S as flowing data wave -->
    <path class="logo-2-stroke" d="M 50 22 Q 48 18 44 18 Q 40 18 40 22 Q 40 26 44 26 Q 50 26 50 30 Q 50 34 44 34 Q 40 34 38 30"/>
    <!-- Circuit nodes at junctions -->
    <circle class="logo-2-node" cx="16" cy="16" r="2"/>
    <circle class="logo-2-node" cx="34" cy="28" r="2"/>
    <circle class="logo-2-node" cx="42" cy="28" r="2"/>
    <circle class="logo-2-node" cx="50" cy="22" r="1.5"/>
  </g>
</svg>